name: Deploy GitHub Pages

on:
  push:
    branches: [main, feature/catalog-refresh]
  workflow_dispatch:
  workflow_run:
    workflows: [Build PR preview]
    types: [completed]
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: (github.event_name != 'workflow_run' && github.ref_name == github.event.repository.default_branch) || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/cache/restore@v4
        with:
          path: data/catalog.json
          key: catalog-${{ github.run_id }}
          restore-keys: catalog-
      - name: Check current manufacturer catalog
        id: catalog
        if: github.event_name != 'workflow_run'
        continue-on-error: true
        run: npm run catalog:update
      - name: Keep previous catalog when manufacturer is unavailable
        if: steps.catalog.outcome == 'failure'
        run: echo "::warning::Catalog refresh failed. Publishing the previous catalog or shipped baseline."
      - uses: actions/cache/save@v4
        if: steps.catalog.outcome == 'success'
        with:
          path: data/catalog.json
          key: catalog-${{ github.run_id }}
      - run: npm run build
      - name: Assemble live PR previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/assemble-previews.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
